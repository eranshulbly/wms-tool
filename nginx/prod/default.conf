# Keeps the nginx -> gunicorn hop on a pooled connection instead of a fresh TCP
# handshake per request. Pairs with `keepalive = 65` in gunicorn-cfg.py; without
# the `Connection ""` header below, nginx closes the upstream socket every time
# and both settings are inert.
upstream backend_app {
    server backend:5000;
    keepalive 32;
}

server {
    listen 80;

    # Order photos are multi-MB phone images; nginx defaults to 1m and would 413.
    # This value MUST match MAX_IMAGE_BYTES in api/shared/media.py — when they
    # disagree the larger one is dead weight, because whichever limit is lower
    # rejects first and the rep on a slow uplink waits out the whole transfer to
    # be told no.
    client_max_body_size 12M;

    # API requests → Flask backend
    location /api/ {
        proxy_pass         http://backend_app/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Health / admin endpoints → Flask backend
    location ~ ^/(health|admin)(/.*)?$ {
        proxy_pass         http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Frontend static files (served by Nginx in frontend container via internal network)
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Gzip. The catalog working set is ~480KB of JSON and compresses to roughly a
    # tenth of that — on a field rep's 2G link that is the difference between a
    # sync that completes and one that times out, so it is load-bearing rather
    # than a nicety.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    # Responses here come from proxy_pass. The default (`off`) skips compression
    # whenever the REQUEST carries a Via header, which is exactly what happens
    # once anything sits in front of nginx — a CDN, a load balancer. Being
    # explicit means compression does not silently switch off the day one is
    # added.
    gzip_proxied any;
    gzip_vary on;
}
