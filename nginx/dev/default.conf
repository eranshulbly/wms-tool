server {
    listen 80;

    # Order photos are multi-MB phone images; nginx defaults to 1m and would 413.
    # Kept identical to prod and to MAX_IMAGE_BYTES in api/shared/media.py, so an
    # upload that is refused in production is refused here too rather than passing
    # in dev and failing in the field.
    client_max_body_size 12M;

    # API requests → Flask backend
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Health / admin → Flask backend
    location ~ ^/(health|admin)(/.*)?$ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Everything else → React dev server
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }
}
